services:
  local-llm:
    # No default mutable tag: select and record an immutable digest explicitly.
    image: ${OLLAMA_IMAGE:?Define OLLAMA_IMAGE as ollama/ollama@sha256:<digest>}
    profiles: ["development", "gpu"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
