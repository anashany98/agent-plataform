[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-bridge-api"
version = "0.9.1"
description = "Núcleo transaccional seguro e integraciones para la plataforma de agentes IA"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: longitud de línea (los archivos legacy superan 120 en firmas largas).
# B008: llamadas en argumentos por defecto — patrón estándar de FastAPI
#       (`Depends(...)`, `Query(...)`); se excluyó explícitamente en el
#       bloque P1 de invariantes y se mantiene por consenso de proyecto.
ignore = ["E501", "B008"]
